name: Bug Report
description: Create a report to help us improve VOLQ AI
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! Please check existing issues first before submitting.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: What steps are needed to trigger this issue?
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error '...'
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: dropdown
    id: database
    attributes:
      label: Database Driver
      description: Which database are you using?
      options:
        - SQLite (Default)
        - PostgreSQL + pgvector
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment Info
      description: Node version, OS, browser, deployment mode (Docker or bare-metal).
      placeholder: |
        - OS: Linux / macOS / Windows
        - Node: v22.x
        - Browser: Chrome / Firefox / Safari
        - Deployment: Docker Compose / npm dev
    validations:
      required: false
